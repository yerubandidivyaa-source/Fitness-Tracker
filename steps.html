<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker - Steps</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .steps-page {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 17px;
        }

        .steps-form {
            width: 100%;
            max-width: 550px;
            margin: 0 auto 40px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .steps-form h2 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 25px;
        }

        .steps-form button {
            display: block;
            width: 100%;
            margin: 5px 0;
        }

        .steps-cards {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .steps-card {
            background: white;
            padding: 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .steps-card:hover {
            transform: translateY(-6px);
        }

        .steps-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .steps-card h3 {
            color: #555;
            margin-bottom: 12px;
        }

        .steps-value {
            font-size: 32px;
            font-weight: bold;
            color: #6c5ce7;
        }

        @media (max-width: 600px) {
            .steps-page {
                width: 94%;
                padding: 25px 10px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .steps-form {
                padding: 22px;
            }

            .steps-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>💪 Fitness Tracker</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="workouts.html">Workouts</a>
            <a href="steps.html">Steps</a>
            <a href="diet.html">Diet</a>
            <a href="goals.html">Goals</a>
            <a href="health.html">Health</a>
            <a href="progress.html">Progress</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main class="steps-page">

        <div class="page-header">
            <h1>👟 Step Tracker</h1>
            <p>Track your daily steps and activity.</p>
        </div>

        <div class="steps-form">

            <h2>Update Today's Steps</h2>

            <label for="steps">Number of Steps</label>

            <input
                type="number"
                id="steps"
                placeholder="Example: 5000"
                min="0"
            >

            <button type="button" onclick="saveSteps()">
                💾 Save Steps
            </button>

        </div>

        <div class="steps-cards">

            <div class="steps-card">
                <div class="steps-icon">👟</div>

                <h3>Today's Steps</h3>

                <div class="steps-value" id="stepsDisplay">
                    0
                </div>
            </div>

            <div class="steps-card">
                <div class="steps-icon">🔥</div>

                <h3>Estimated Calories</h3>

                <div class="steps-value" id="caloriesDisplay">
                    0 kcal
                </div>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Fitness Tracker</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/steps.js"></script>

</body>
</html>
