<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker - Water</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .water-page {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 17px;
        }

        .water-form {
            max-width: 550px;
            margin: 0 auto 40px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .water-form h2 {
            text-align: center;
            color: #0984e3;
            margin-bottom: 25px;
        }

        .water-form button {
            width: 100%;
            margin: 5px 0;
            background: linear-gradient(135deg, #0984e3, #00cec9);
        }

        .water-display {
            max-width: 550px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0984e3, #00cec9);
            color: white;
            padding: 35px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(9, 132, 227, 0.25);
        }

        .water-icon {
            font-size: 55px;
        }

        .water-value {
            font-size: 42px;
            font-weight: 800;
            margin: 10px 0;
        }

        .water-display p {
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .water-page {
                padding: 25px 10px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .water-form {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>💪 Fitness Tracker</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="workouts.html">Workouts</a>
            <a href="steps.html">Steps</a>
            <a href="diet.html">Diet</a>
            <a href="goals.html">Goals</a>
            <a href="health.html">Health</a>
            <a href="progress.html">Progress</a>
            <a href="water.html">Water</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main class="water-page">

        <div class="page-header">
            <h1>💧 Water Tracker</h1>
            <p>Keep track of the water you drink.</p>
        </div>

        <div class="water-form">

            <h2>Update Water Intake</h2>

            <label for="water">Water Intake (Litres)</label>

            <input
                type="number"
                id="water"
                placeholder="Example: 2"
                min="0"
                step="0.1"
            >

            <button type="button" onclick="saveWater()">
                💧 Save Water
            </button>

        </div>

        <div class="water-display">

            <div class="water-icon">
                💧
            </div>

            <h2>Today's Water</h2>

            <div class="water-value" id="waterDisplay">
                0 L
            </div>

            <p>Water intake saved in your Fitness Tracker.</p>

        </div>

    </main>

    <footer>
        <p>© 2026 Fitness Tracker</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/water.js"></script>

</body>
</html>
