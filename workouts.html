<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Workouts</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .workout-page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 17px;
        }

        .workout-form {
            max-width: 550px;
            margin: 0 auto 40px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .workout-form h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #6c5ce7;
        }

        .workout-form button {
            display: block;
            width: 100%;
            margin: 5px 0;
        }

        .workout-list-title {
            text-align: center;
            margin-bottom: 20px;
        }

        #workoutList {
            max-width: 800px;
            margin: 0 auto;
        }

        .workout-item {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #6c5ce7;
            transition: 0.3s;
        }

        .workout-item:hover {
            transform: translateY(-5px);
        }

        .workout-item h3 {
            color: #6c5ce7;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .workout-item p {
            margin: 7px 0;
            color: #666;
        }

        .workout-item button {
            margin-top: 12px;
            background: linear-gradient(135deg, #ff7675, #d63031);
        }

        .empty-message {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 15px;
            color: #777;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        @media (max-width: 600px) {
            .workout-page {
                padding: 25px 15px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .workout-form {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>💪 Fitness Tracker</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="workouts.html">Workouts</a>
            <a href="steps.html">Steps</a>
            <a href="diet.html">Diet</a>
            <a href="goals.html">Goals</a>
            <a href="health.html">Health</a>
            <a href="progress.html">Progress</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>


    <main class="workout-page">

        <div class="page-header">
            <h1>🏋️ My Workouts</h1>
            <p>Track your workouts and stay consistent.</p>
        </div>


        <div class="workout-form">

            <h2>Add New Workout</h2>

            <label for="workoutName">Workout Name</label>
            <input
                type="text"
                id="workoutName"
                placeholder="Example: Running"
            >

            <label for="duration">Duration (minutes)</label>
            <input
                type="number"
                id="duration"
                placeholder="Example: 30"
                min="1"
            >

            <button onclick="addWorkout()">
                ➕ Add Workout
            </button>

        </div>


        <h2 class="workout-list-title">
            📋 Workout History
        </h2>

        <div id="workoutList">
            <div class="empty-message">
                No workouts added yet.
            </div>
        </div>

    </main>


    <footer>
        <p>© 2026 Fitness Tracker</p>
    </footer>


    <script src="js/auth.js"></script>
    <script src="js/workouts.js"></script>

</body>
</html>
